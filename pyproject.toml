[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-floor"
version = "0.1.0"
description = "Multi-agent quantitative trading operating system — paper trading only"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "httpx>=0.26",
    "redis>=5.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
intelligence = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
trading-floor = "apps.orchestrator.__main__:main"
trading-floor-replay = "replay.__main__:main"

[tool.setuptools]
packages = [
    "agents",
    "agents.lumen",
    "agents.marin",
    "agents.noro",
    "agents.okapi",
    "agents.rune",
    "agents.tidal",
    "agents.zephr",
    "apps",
    "apps.api",
    "apps.dashboard",
    "apps.orchestrator",
    "core",
    "core.bus",
    "core.clock",
    "core.config",
    "core.events",
    "core.health",
    "core.models",
    "core.state",
    "execution",
    "execution.oms",
    "execution.paper",
    "execution.router",
    "execution.veska",
    "monitoring",
    "replay",
    "risk",
    "risk.kill_switch",
    "risk.limits",
    "simulation",
    "storage",
    "strategies",
    "strategies.consensus",
    "strategies.cross_venue",
    "venues",
    "venues.base",
    "venues.venue_a",
    "venues.venue_b",
]

[tool.setuptools.package-data]
"apps.dashboard" = ["*.html"]
"storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:core.*", "error::DeprecationWarning:agents.*"]
markers = [
    "slow: longer end-to-end runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI dependency defaults
    "RUF012",  # mutable class attrs are intentional on dataclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
